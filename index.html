    <style>
        :root {
            --bg: #0b0d10;
            --surface: #111419;
            --surface-2: #151922;
            --surface-hover: #1a1f29;
            --border: #292f39;
            --border-soft: #20252d;
            --text: #e7e9ed;
            --muted: #8c939e;
            --muted-2: #686f7a;
            --accent: #d9dde5;
            --shadow: 0 8px 24px rgba(0,0,0,.18);
            --radius: 7px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f5;
            color: #25282d;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }

        h1 {
            margin: 0;
            margin-bottom: 1px;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -.35px;
        }

        body.live-data-pending .players-count .player-box {
            visibility: hidden;
        }

        .live-loading {
            color: inherit;
        }

        #top-bar {
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(241,243,245,.84);
            margin: -20px -20px 20px -20px;
            padding: 13px 20px;
            border-bottom: 1px solid #d5d9de;
            box-shadow: 0 4px 14px rgba(0,0,0,.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #top-bar-buttons {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #status {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #747b84;
            line-height: 1.35;
        }

        #status .status-summary,
        #status .status-updated {
            display: block;
        }

        #status .status-updated {
            margin-top: 2px;
        }

        #status .status-date-mobile,
        #status .status-label-mobile {
            display: none;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
            background: #fff;
            color: #33373d;
            border: 1px solid #cbd0d6;
            border-radius: 6px;
            transition: background .15s ease, border-color .15s ease, transform .12s ease, box-shadow .15s ease;
        }

        button:hover {
            background: #f7f8f9;
            border-color: #aeb5bd;
            box-shadow: 0 2px 7px rgba(0,0,0,.07);
        }

        button:active { transform: translateY(1px); }

        .status-button {
            width: 36px;
            height: 35px;
            padding: 0;
            margin-left: 2px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #cbd0d6;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            position: relative;
            top: 0;
        }

        .status-button:hover { background: #f7f8f9; }

        .status-icon {
            width: 19px;
            height: 19px;
            position: relative;
            display: block;
        }

        .status-icon::before {
            content: "";
            position: absolute;
            left: 1px;
            right: 1px;
            top: 9px;
            height: 1px;
            background: #777;
            transform: rotate(-28deg);
            transform-origin: center;
        }

        .status-icon::after {
            content: "";
            position: absolute;
            width: 4px;
            height: 4px;
            left: 2px;
            top: 10px;
            border: 1px solid #777;
            border-radius: 50%;
            box-sizing: border-box;
            box-shadow:
                5px -5px 0 -1px white,
                5px -5px 0 0 #777,
                10px -1px 0 -1px white,
                10px -1px 0 0 #777;
        }

        .refresh-icon {
            width: 19px;
            height: 19px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            line-height: 1;
            transform-origin: center;
        }

        .refresh-icon::before {
            content: "↻";
            display: block;
        }

        .top-icon {
            width: 18px;
            height: 18px;
            display: block;
            color: #777;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .refresh-button.is-loading .refresh-icon {
            animation: refresh-spin .8s ease-in-out;
        }

        @keyframes refresh-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .game-buttons {

            gap: 7px;
            flex-wrap: wrap;
            margin: 10px 0 18px 0;

        body.dark-mode .servers-loading {
            color: #858d98;
        }

        .game-button {

            font-size: 12px;
            line-height: 1.2;
            background: #fff;
            color: #33373d;
            border: 1px solid #cbd0d6;

        .game-button strong {

        .table-container {

        }

        table {

            border-collapse: separate;
            border-spacing: 0;
            min-width: 700px;

        th.country-column, td.country { width: 9%; }
        th.server-column, td.server-name { width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .country {

        /* Pagination Styles */
        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f8f9fa;
            border-top: 1px solid #e0e3e7;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
            color: #6d747d;

        .pagination-info {
            font-weight: 500;
        }

            display: flex;

            gap: 4px;

        .pagination-button {

            border: 1px solid #cbd0d6;
            background: #fff;
            color: #33373d;

        .pagination-button:hover:not(:disabled) {
            background: #f0f2f4;
            border-color: #aeb5bd;
        }

        .pagination-button.active {
            background: #e7eaee;
            border-color: #8f97a1;
            font-weight: bold;
        }

        .pagination-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

            padding: 0 4px;

</head>
<body class="dark-mode live-data-pending">

<div id="top-bar">
    <div>
        <h1>Plutonium Servers</h1>
        <p id="status"><span class="live-loading">Loading live servers list...</span></p>
    </div>

    <div id="top-bar-buttons">
        <button onclick="openStatusPage()" class="status-button" title="Plutonium Status" aria-label="Plutonium Status">
            <span class="status-icon"></span>
        </button>

        <button onclick="toggleDarkMode()" id="darkModeButton">🌙</button>

        <button onclick="loadServers()" class="status-button refresh-button" id="refreshButton" title="Actualizar servidores" aria-label="Actualizar servidores">
            <span class="refresh-icon"></span>
        </button>


            </svg>
        </button>
    </div>
</div>

<!-- BOTONES DE JUEGOS -->
<div id="gameButtons" class="game-buttons">
    <!-- Rendered dynamically -->
</div>

<!-- BUSCADOR -->
<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search server, map, country..." onkeydown="handleSearchKey(event)">
    <button onclick="searchServers()">Search</button>
    <button onclick="clearSearch()">Clear</button>
</div>

<div id="servers">
    <div id="servers-loading" class="servers-loading" aria-live="polite">
        <span class="servers-loading-text">Loading live servers list...</span>
    </div>
</div>

<script>

const API_URLS = [
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T6&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T6ZM&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=IW5&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T4&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T4ZM&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T5&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T5ZM&limit=500"
];

let allServers = [];
let currentSort = "players";
let sortDescending = true;
let expandedServerId = null;
let selectedGame = "ALL";
let hasLoadedServers = false;
let activeLoadRequest = 0;
let currentPage = 1;
const itemsPerPage = 50;

const urlParams = new URLSearchParams(window.location.search);
let searchQuery = (urlParams.get("q") || "").trim().toLowerCase();

window.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("searchInput");
    if (input) {
        input.value = searchQuery;
    }
});

function openStatusPage() {
    window.open("https://status.plutonium.pw/", "_blank");
}

function startRefreshAnimation() {
    const button = document.getElementById("refreshButton");
    if (!button) return;
    button.classList.remove("is-loading");
    void button.offsetWidth;
    button.classList.add("is-loading");
}

function stopRefreshAnimation() {
    const button = document.getElementById("refreshButton");
    if (button) {
        button.classList.remove("is-loading");
    }
}

function getServerKey(server) {
    if (!server) return null;
    const gameId = server.game?.id || server.game?.name || "UNKNOWN";
    const endpointId = server.id || server.address || (server.ip && server.port ? `${server.ip}:${server.port}` : null);
    if (endpointId) return `${gameId}:${endpointId}`;

    return [
        gameId,
        server.name || "",
        server.map?.raw || server.map?.display || "",
        server.mode?.raw || server.mode?.display || ""
    ].join("|");
}

async function loadServers() {
    const status = document.getElementById("status");
    selectedGame = getGameFromCurrentUrl();

    const requestId = ++activeLoadRequest;
    const serversContainer = document.getElementById("servers");

    if (!hasLoadedServers && serversContainer) {
        serversContainer.innerHTML = `
            <div id="servers-loading" class="servers-loading" aria-live="polite">
                <span class="servers-loading-text">Loading live servers list...</span>
            </div>
        `;
        serversContainer.classList.remove("is-ready");
    }

    startRefreshAnimation();

    try {
        const responseResults = await Promise.allSettled(
            API_URLS.map(url => fetch(url))
        );

        const responses = responseResults
            .filter(res => res.status === "fulfilled" && res.value.ok)
            .map(res => res.value);

        if (!responses.length) {
            throw new Error("No server feeds were available");
        }

        const results = await Promise.all(responses.map(res => res.json()));

        if (requestId !== activeLoadRequest) return;

        allServers = results.flatMap(result => {
            if (result && result.success && result.data && Array.isArray(result.data.servers)) {
                return result.data.servers.filter(server => server != null);
            }
            return [];
        });

        const uniqueServers = new Map();
        allServers.filter(s => s != null).forEach(server => {
            const serverId = server.id || server.address || (server.ip && server.port ? `${server.ip}:${server.port}` : null);
            if (serverId) {
                uniqueServers.set(serverId, server);
            }
        });

        allServers = Array.from(uniqueServers.values());
        const totalPlayers = allServers.reduce((total, server) => total + Number(server?.players?.current || 0), 0);

        const updatedAt = new Date();
        const desktopDate = updatedAt.toLocaleString("en-US", {
            month: "short", day: "numeric", year: "numeric",
            hour: "numeric", minute: "2-digit", hour12: true
        });
        const mobileDate = updatedAt.toLocaleString("en-US", {
            month: "short", day: "numeric",
            hour: "numeric", minute: "2-digit", hour12: true
        });

        if (status) {
            status.innerHTML = `
                <span class="status-summary">
                    ${allServers.length} servers | ${totalPlayers} players online
                </span>
                <span class="status-updated">
                    <span class="status-label-desktop">Updated on</span>
                    <span class="status-label-mobile">Updated</span>
                    <span class="status-date-desktop">${desktopDate}.</span>
                    <span class="status-date-mobile">${mobileDate}.</span>
                </span>
            `;
        }

        renderGameButtons();
        renderServers();

        if (serversContainer) serversContainer.classList.add("is-ready");
        document.getElementById("gameButtons")?.classList.add("is-ready");
        hasLoadedServers = true;

    } catch (error) {
        if (requestId !== activeLoadRequest) return;
        console.error(error);

        if (status) {
            status.innerHTML = `<span class="error">Error loading servers: ${escapeHtml(error?.message || "Unknown error")}</span>`;
        }

        if (!hasLoadedServers && serversContainer) {
            serversContainer.innerHTML = `<div class="no-results">Live server data is temporarily unavailable.</div>`;
            serversContainer.classList.add("is-ready");
        }
    } finally {
        if (requestId === activeLoadRequest) {
            stopRefreshAnimation();
            document.body.classList.remove("live-data-pending");
        }
    }
}

/* =========================
   BOTONES DE JUEGOS
========================= */

function renderGameButtons() {
    const container = document.getElementById("gameButtons");
    if (!container) return;
    container.innerHTML = "";

    const allPlayers = allServers.reduce((total, server) => total + Number(server?.players?.current || 0), 0);

    const allButton = document.createElement("button");
    allButton.className = "game-button";
    allButton.type = "button";

    if (selectedGame === "ALL") {
        allButton.classList.add("active");
    }

    allButton.innerHTML = `
        <strong>ALL</strong>
        <small>All Games<br>${allServers.length} servers · ${allPlayers} online</small>
    `;
    allButton.onclick = () => selectGame("ALL");
    container.appendChild(allButton);

    const games = {};
    allServers.forEach(server => {
        const gameId = server.game?.id || "UNKNOWN";
        const gameName = server.game?.name || "Unknown Game";
        if (!games[gameId]) {
            games[gameId] = { id: gameId, name: gameName, servers: [] };
        }
        games[gameId].servers.push(server);
    });

    Object.values(games).forEach(game => {
        const players = game.servers.reduce((total, server) => total + Number(server?.players?.current || 0), 0);
        const button = document.createElement("button");
        button.className = "game-button";
        button.type = "button";
        button.dataset.gameId = game.id;

        if (selectedGame === game.id) {
            button.classList.add("active");
        }

        button.innerHTML = `
            <strong>${escapeHtml(getShortGameName(game.id))}</strong>
            <small>${escapeHtml(game.name)}<br>${game.servers.length} servers · ${players} online</small>
        `;
        button.onclick = () => selectGame(game.id);
        container.appendChild(button);
    });
}

function getShortGameName(gameId) {
    const names = {
        "T6": "BO2 MP", "T6ZM": "BO2 ZM", "IW5": "MW3 MP",
        "T5": "BO1 MP", "T5ZM": "BO1 ZM", "T4": "WaW MP", "T4ZM": "WaW ZM"
    };
    return names[gameId] || gameId;
}

const GAME_PATHS = { 
    "T6": "#BO2-MP", "T6ZM": "#BO2-ZM", "IW5": "#MW3-MP", 
    "T5": "#BO1-MP", "T5ZM": "#BO1-ZM", "T4": "#WaW-MP", "T4ZM": "#WaW-ZM" 
}; 
 
function selectGame(gameId) { 
    selectedGame = gameId || "ALL"; 
    expandedServerId = null; 
    currentPage = 1;
 
    renderGameButtons(); 
    renderServers(); 
 
    const targetHash = (selectedGame !== "ALL" && GAME_PATHS[selectedGame]) ? GAME_PATHS[selectedGame] : ""; 
    const currentHash = window.location.hash; 
 
    if (currentHash !== targetHash) { 
        const newUrl = window.location.pathname + window.location.search + targetHash; 
        window.history.pushState( 
            { game: selectedGame }, 
            "", 
            newUrl 
        ); 
    } 
} 
 
function getGameFromCurrentUrl() { 
    const currentHash = window.location.hash.toLowerCase(); 
    if (currentHash) { 
        const hashMatch = Object.entries(GAME_PATHS).find( 
            ([, gamePath]) => gamePath.toLowerCase() === currentHash || ("/" + gamePath.toLowerCase()) === currentHash 
        ); 
        if (hashMatch) return hashMatch[0]; 
    } 
    const currentPath = window.location.pathname.replace(/\/+$/, "").toLowerCase() || "/"; 
    const pathMatch = Object.entries(GAME_PATHS).find( 
        ([, gamePath]) => gamePath.replace(/^#/, "/").toLowerCase() === currentPath 
    ); 
    return pathMatch ? pathMatch[0] : "ALL"; 
} 
 
function handleUrlChange() { 
    selectedGame = getGameFromCurrentUrl(); 
    expandedServerId = null; 
    currentPage = 1;
    renderGameButtons(); 
    renderServers(); 
} 
 
window.addEventListener("popstate", handleUrlChange); 
window.addEventListener("hashchange", handleUrlChange); 

/* =========================
   RENDER SERVIDORES
========================= */

function renderServers() {
    const container = document.getElementById("servers");
    if (!container) return;
    container.innerHTML = "";

    let filteredServers = allServers;

    if (selectedGame !== "ALL") {
        filteredServers = filteredServers.filter(server => server.game?.id === selectedGame);
    }

    if (searchQuery) {
        filteredServers = filteredServers.filter(server => {
            if (!server) return false;
            const searchableText = [
                server.name, server.map?.display, server.map?.raw,
                server.mode?.display, server.mode?.raw,
                server.location?.countryName, server.location?.countryCode,
                server.game?.name, server.game?.id
            ].filter(Boolean).join(" ").toLowerCase();
            return searchableText.includes(searchQuery);
        });
    }

    const games = {};

    if (selectedGame === "ALL") {
        games.ALL = {
            name: "All Games",
            servers: filteredServers.filter(server => server != null)
        };
    } else {
        filteredServers.filter(server => server != null).forEach(server => {
            const gameId = server.game?.id || "UNKNOWN";
            const gameName = server.game?.name || "Unknown Game";
            if (!games[gameId]) {
                games[gameId] = { name: gameName, servers: [] };
            }
            games[gameId].servers.push(server);
        });
    }

    Object.entries(games).forEach(([gameId, game]) => {
        renderGame(gameId, game, container);
    });

    if (filteredServers.length === 0) {
        container.innerHTML = `<div class="no-results">No servers found.</div>`;
    }
}

function renderGame(gameId, game, container) {
    const gameElement = document.createElement("div");
    gameElement.className = "game";
    gameElement.dataset.gameId = gameId;

    const gameTitle = document.createElement("h2");
    gameTitle.className = "game-title";
    const onlinePlayers = game.servers.reduce((total, server) => total + Number(server?.players?.current || 0), 0);
    gameTitle.textContent = `${game.name} - ${game.servers.length} servers · ${onlinePlayers} online`;
    gameElement.appendChild(gameTitle);

    const tableContainer = document.createElement("div");
    tableContainer.className = "table-container";

    const table = document.createElement("table");
    const thead = document.createElement("thead");

    thead.innerHTML = `
        <tr>
            <th class="country-column" onclick="sortByCountry()">
                Country ${currentSort === "country" ? `<span class="sort-arrow">${sortDescending ? "▼" : "▲"}</span>` : ""}
            </th>
            <th class="server-column" onclick="sortByServer()">
                Server ${currentSort === "server" ? `<span class="sort-arrow">${sortDescending ? "▼" : "▲"}</span>` : ""}
            </th>
            <th class="players-column" onclick="sortByPlayers()">
                Players ${currentSort === "players" ? `<span class="sort-arrow">${sortDescending ? "▼" : "▲"}</span>` : ""}
            </th>
            <th class="game-column" onclick="sortByGame()">
                Game ${currentSort === "game" ? `<span class="sort-arrow">${sortDescending ? "▼" : "▲"}</span>` : ""}
            </th>
            <th class="map-column" onclick="sortByMap()">
                Map ${currentSort === "map" ? `<span class="sort-arrow">${sortDescending ? "▼" : "▲"}</span>` : ""}
            </th>
            <th class="mode-column" onclick="sortByMode()">
                Mode ${currentSort === "mode" ? `<span class="sort-arrow">${sortDescending ? "▼" : "▲"}</span>` : ""}
            </th>
        </tr>
    `;

    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const sortedServers = [...game.servers].sort(sortServers);

    const totalServers = sortedServers.length;
    const totalPages = Math.ceil(totalServers / itemsPerPage) || 1;

    if (currentPage > totalPages) {
        currentPage = totalPages;
    }
    if (currentPage < 1) {
        currentPage = 1;
    }

    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = Math.min(startIndex + itemsPerPage, totalServers);
    const paginatedServers = sortedServers.slice(startIndex, endIndex);

    paginatedServers.forEach(server => {
        if (!server) return;

        const serverId = server.id || server.address || (server.ip && server.port ? `${server.ip}:${server.port}` : getServerKey(server));
        const players = server.players || {};
        const currentPlayers = Number(players.current || 0);
        const maxPlayers = Number(players.max || 0);

        let country = server.location?.countryName || server.location?.countryCode || "Unknown";
        let countryCode = server.location?.countryCode || getCountryCode(country);

        if (server.ip === "74.0.5.27") { country = "Brazil"; countryCode = "BR"; }
        if (server.ip === "100.92.24.78" || server.ip === "100.92.44.197") { country = "United States"; countryCode = "US"; }
        if (server.ip === "100.92.6.225" || server.ip === "100.92.100.197") { country = "Italy"; countryCode = "IT"; }

        const flag = getCountryFlag(countryCode);
        const isExpanded = expandedServerId === serverId;

        let playerClass = "player-empty";
        if (currentPlayers === maxPlayers && maxPlayers > 0) { playerClass = "player-full"; }
        else if (currentPlayers >= 9) { playerClass = "player-medium"; }
        else if (currentPlayers >= 1) { playerClass = "player-low"; }

        const row = document.createElement("tr");
        row.className = "server-row";
        row.onclick = () => toggleServer(serverId);

        row.innerHTML = `
            <td class="country" title="${escapeHtml(country)}">${flag}</td>
            <td class="server-name">
                <span class="expand-arrow ${isExpanded ? "open" : ""}">${isExpanded ? "⌃" : "⌄"}</span>
                ${escapeHtml(server.name || "Unknown Server")}
            </td>
            <td class="players-count"><span class="player-box ${playerClass}">${currentPlayers}/${maxPlayers}</span></td>
            <td class="game-name" title="${escapeHtml(getShortGameName(server.game?.id || gameId || "UNKNOWN"))}">
                ${escapeHtml(getShortGameName(server.game?.id || gameId || "UNKNOWN"))}
            </td>
            <td class="map-cell">${escapeHtml(server.map?.display || server.map?.raw || "Unknown")}</td>
            <td class="mode-cell">${escapeHtml(server.mode?.display || server.mode?.raw || "Unknown")}</td>
        `;

        tbody.appendChild(row);

        if (expandedServerId === serverId) {
            const detailsRow = createDetailsRow(server);
            tbody.appendChild(detailsRow);
        }
    });

    table.appendChild(tbody);
    tableContainer.appendChild(table);
    gameElement.appendChild(tableContainer);

    if (totalServers > 0) {
        const paginationContainer = document.createElement("div");
        paginationContainer.className = "pagination-container";

        const paginationInfo = document.createElement("div");
        paginationInfo.className = "pagination-info";
        paginationInfo.textContent = `Showing ${startIndex + 1}-${endIndex} of ${totalServers} servers`;

        const paginationButtons = document.createElement("div");
        paginationButtons.className = "pagination-buttons";

        const prevBtn = document.createElement("button");
        prevBtn.className = "pagination-button";
        prevBtn.textContent = "« Previous";
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => goToPage(currentPage - 1);
        paginationButtons.appendChild(prevBtn);

        const maxPagesToShow = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxPagesToShow / 2));
        let endPage = Math.min(totalPages, startPage + maxPagesToShow - 1);

        if (endPage - startPage + 1 < maxPagesToShow) {
            startPage = Math.max(1, endPage - maxPagesToShow + 1);
        }

        if (startPage > 1) {
            const firstBtn = document.createElement("button");
            firstBtn.className = "pagination-button";
            firstBtn.textContent = "1";
            firstBtn.onclick = () => goToPage(1);
            paginationButtons.appendChild(firstBtn);

            if (startPage > 2) {
                const ellipsis = document.createElement("span");
                ellipsis.className = "pagination-ellipsis";
                ellipsis.textContent = "…";
                paginationButtons.appendChild(ellipsis);
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement("button");
            pageBtn.className = "pagination-button" + (i === currentPage ? " active" : "");
            pageBtn.textContent = i;
            pageBtn.onclick = () => goToPage(i);
            paginationButtons.appendChild(pageBtn);
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                const ellipsis = document.createElement("span");
                ellipsis.className = "pagination-ellipsis";
                ellipsis.textContent = "…";
                paginationButtons.appendChild(ellipsis);
            }

            const lastBtn = document.createElement("button");
            lastBtn.className = "pagination-button";
            lastBtn.textContent = totalPages;
            lastBtn.onclick = () => goToPage(totalPages);
            paginationButtons.appendChild(lastBtn);
        }

        const nextBtn = document.createElement("button");
        nextBtn.className = "pagination-button";
        nextBtn.textContent = "Next »";
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => goToPage(currentPage + 1);
        paginationButtons.appendChild(nextBtn);

        paginationContainer.appendChild(paginationInfo);
        paginationContainer.appendChild(paginationButtons);
        gameElement.appendChild(paginationContainer);
    }

    container.appendChild(gameElement);
}

function goToPage(page) {
    currentPage = page;
    expandedServerId = null;
    renderServers();
    const serversEl = document.getElementById("servers");
    if (serversEl) {
        serversEl.scrollIntoView({ behavior: "smooth" });
    }
}

function getCountryFlag(countryCode) {
    if (!countryCode || countryCode.length !== 2) return "🌐";
    const code = countryCode.toLowerCase();
    return `<img src="https://flagcdn.com/w40/${code}.png" alt="${code}" class="country-flag" loading="lazy">`;
}

function getCountryCode(countryName) {
    const countries = {
        "argentina": "AR", "brazil": "BR", "brasil": "BR", "united states": "US", "usa": "US",
        "canada": "CA", "mexico": "MX", "chile": "CL", "uruguay": "UY", "paraguay": "PY",
        "bolivia": "BO", "peru": "PE", "colombia": "CO", "venezuela": "VE", "ecuador": "EC",
        "germany": "DE", "france": "FR", "spain": "ES", "italy": "IT", "portugal": "PT",
        "united kingdom": "GB", "uk": "GB", "netherlands": "NL", "belgium": "BE", "switzerland": "CH",
        "austria": "AT", "poland": "PL", "russia": "RU", "ukraine": "UA", "turkey": "TR",
        "australia": "AU", "japan": "JP", "china": "CN", "south korea": "KR", "india": "IN",
        "singapore": "SG", "south africa": "ZA"
    };
    if (!countryName) return null;
    return countries[String(countryName).trim().toLowerCase()] || null;
}

function sortServers(a, b) {
    if (!a || !b) return 0;

    if (currentSort === "country") {
        const countryA = (a.location?.countryName || a.location?.countryCode || "Unknown").toLowerCase();
        const countryB = (b.location?.countryName || b.location?.countryCode || "Unknown").toLowerCase();
        const result = countryA.localeCompare(countryB);
        return sortDescending ? -result : result;
    }

    if (currentSort === "players") {
        const playersA = Number(a.players?.current || 0);
        const playersB = Number(b.players?.current || 0);
        return sortDescending ? playersB - playersA : playersA - playersB;
    }

    if (currentSort === "game") {
        const gameA = getShortGameName(a.game?.id || a.game?.name || "UNKNOWN").toLowerCase();
        const gameB = getShortGameName(b.game?.id || b.game?.name || "UNKNOWN").toLowerCase();
        const r = gameA.localeCompare(gameB);
        return sortDescending ? -r : r;
    }

    if (currentSort === "server") {
        const r = (a.name || "").toLowerCase().localeCompare((b.name || "").toLowerCase());
        return sortDescending ? -r : r;
    }

    if (currentSort === "map") {
        const r = (a.map?.display || a.map?.raw || "").toLowerCase().localeCompare((b.map?.display || b.map?.raw || "").toLowerCase());
        return sortDescending ? -r : r;
    }

    if (currentSort === "mode") {
        const r = (a.mode?.display || a.mode?.raw || "").toLowerCase().localeCompare((b.mode?.display || b.mode?.raw || "").toLowerCase());
        return sortDescending ? -r : r;
    }

    return 0;
}

function sortByCountry() {
    if (currentSort === "country") { sortDescending = !sortDescending; }
    else { currentSort = "country"; sortDescending = false; }
    currentPage = 1;
    renderServers();
}

function sortByPlayers() {
    if (currentSort === "players") { sortDescending = !sortDescending; }
    else { currentSort = "players"; sortDescending = true; }
    currentPage = 1;
    renderServers();
}

function sortByServer() {
    if (currentSort === "server") { sortDescending = !sortDescending; }
    else { currentSort = "server"; sortDescending = false; }
    currentPage = 1;
    renderServers();
}

function sortByGame() {
    if (currentSort === "game") { sortDescending = !sortDescending; }
    else { currentSort = "game"; sortDescending = false; }
    currentPage = 1;
    renderServers();
}

function sortByMap() {
    if (currentSort === "map") { sortDescending = !sortDescending; }
    else { currentSort = "map"; sortDescending = false; }
    currentPage = 1;
    renderServers();
}

function sortByMode() {
    if (currentSort === "mode") { sortDescending = !sortDescending; }
    else { currentSort = "mode"; sortDescending = false; }
    currentPage = 1;
    renderServers();
}

function handleSearchKey(event) {
    if (event.key === "Enter") {
        searchServers();
    }
}

function searchServers() {
    const input = document.getElementById("searchInput");
    const query = input.value.trim().toLowerCase();
    searchQuery = query;

    const url = new URL(window.location.href);
    if (query) { url.searchParams.set("q", query); }
    else { url.searchParams.delete("q"); }

    window.history.pushState({}, "", url);
    expandedServerId = null;
    currentPage = 1;
    renderServers();
}

function clearSearch() {
    const input = document.getElementById("searchInput");
    input.value = "";
    searchQuery = "";

    const url = new URL(window.location.href);
    url.searchParams.delete("q");

    window.history.pushState({}, "", url);
    expandedServerId = null;
    currentPage = 1;
    renderServers();
}

function toggleServer(serverId) {
    expandedServerId = expandedServerId === serverId ? null : serverId;
    renderServers();
}

function createDetailsRow(server) {
    const row = document.createElement("tr");
    row.className = "details-row";

    const cell = document.createElement("td");
    cell.colSpan = 6;

    const details = document.createElement("div");
    details.className = "details";

    const players = server.players || {};
    const gameName = getShortGameName(server.game?.id || server.game?.name || "UNKNOWN");
    const address = server.address || (server.ip && server.port ? `${server.ip}:${server.port}` : "");

    details.innerHTML = `
        <p class="detail-server-name">
            <strong>Servername:</strong>
            <span class="detail-server-name-value">${escapeHtml(server.name || "Unknown Server")}</span>
        </p>
        <p><strong>Connect:</strong> ${escapeHtml(address)} ${address ? `<button class="copy-button" onclick="copyConnectCommand(event, '${escapeHtml(address)}')">⧉</button>` : ""}</p>
        <p><strong>Game:</strong> ${escapeHtml(gameName)}</p>
        <p><strong>Players:</strong> ${players.current || 0} / ${players.max || 0}</p>
        <p><strong>Map:</strong> ${escapeHtml(server.map?.display || server.map?.raw || "Unknown")}</p>
        <p><strong>Mode:</strong> ${escapeHtml(server.mode?.display || server.mode?.raw || "Unknown")}</p>
    `;

    cell.appendChild(details);
    row.appendChild(cell);
    return row;
}

function copyServerName(event) {
    event.stopPropagation();
    const button = event.currentTarget;
    const nameElement = button.parentElement.querySelector(".detail-server-name-value");
    const serverName = nameElement ? nameElement.textContent.trim() : "";

    if (!serverName) return;

    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(serverName)
            .then(() => showServerNameCopied(button))
            .catch(() => legacyCopyServerName(serverName, button));
        return;
    }
    legacyCopyServerName(serverName, button);
}

function legacyCopyServerName(serverName, button) {
    const textarea = document.createElement("textarea");
    textarea.value = serverName;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-10000px";
    textarea.style.top = "-10000px";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    let copied = false;
    try { copied = document.execCommand("copy"); } catch (error) { copied = false; }
    textarea.remove();

    if (copied) { showServerNameCopied(button); }
}

function showServerNameCopied(button) {
    button.textContent = "✓";
    button.classList.add("copied");
    setTimeout(() => {
        button.textContent = "⧉";
        button.classList.remove("copied");
    }, 1500);
}

function copyConnectCommand(event, address) {
    event.stopPropagation();
    const command = "connect " + address;
    const button = event.currentTarget;

    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(command).then(() => showServerNameCopied(button)).catch(() => legacyCopyServerName(command, button));
    } else {
        legacyCopyServerName(command, button);
    }
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
    const enabled = document.body.classList.contains("dark-mode");
    localStorage.setItem("darkMode", enabled ? "yes" : "no");
    document.getElementById("darkModeButton").textContent = enabled ? "☀️" : "🌙";
}

function loadDarkMode() {
    const savedMode = localStorage.getItem("darkMode");
    if (savedMode === null || savedMode === "yes") {
        document.body.classList.add("dark-mode");
        const btn = document.getElementById("darkModeButton");
        if (btn) btn.textContent = "☀️";
    } else {
        document.body.classList.remove("dark-mode");
        const btn = document.getElementById("darkModeButton");
        if (btn) btn.textContent = "🌙";
    }
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = String(text ?? "");
    return div.innerHTML;
}

loadDarkMode();
selectedGame = getGameFromCurrentUrl();
loadServers();
setInterval(loadServers, 30000);

</script>
